openapi: 3.1.0
info:
  title: C01 DPC admission API
  version: 0.1.0
  description: DPC LR1 admission routes. Other laboratories remain planned.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ScanInput:
      type: object
      required: [scan_id, ticket_id, ticket_code, gate, sector_id, event_time]
      properties:
        scan_id: {type: string, minLength: 1}
        ticket_id: {type: string, minLength: 1}
        ticket_code: {type: string, minLength: 1}
        gate: {type: string, minLength: 1}
        sector_id: {type: string, minLength: 1}
        event_time: {type: string, format: date-time}
    ComputeInput:
      type: object
      required: [a, b, n, workers, method, order]
      properties:
        a: {type: number, minimum: 0, maximum: 90}
        b: {type: number, exclusiveMinimum: 0, maximum: 90}
        n: {type: integer, minimum: 1, maximum: 20000000}
        workers: {type: integer, minimum: 1, maximum: 4}
        method: {type: string, enum: [midpoint, simpson]}
        order: {type: integer, enum: [2, 4]}
        chunks_per_worker: {type: integer, minimum: 1, maximum: 16, default: 1}
    Problem:
      type: object
      required: [type, title, status, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
paths:
  /v1/compute:
    post:
      security: [{bearerAuth: []}]
      description: Integrate C01 arrivals using CPU child processes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ComputeInput'}
      responses:
        '200': {description: Numerical value, analytic reference, error, elapsed time and worker count}
        '400': {description: Invalid interval or method/order pair}
        '401': {description: Bearer token required}
        '503': {description: Process pool unavailable}
  /health:
    get:
      responses:
        '200': {description: Process is alive}
  /metrics:
    get:
      responses:
        '200': {description: Runtime counters and HTTP latency summary}
  /v1/scans:
    post:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScanInput'}
      responses:
        '202': {description: Accepted into bounded queue}
        '400': {description: Invalid input}
        '401': {description: Bearer token missing or invalid}
        '409': {description: scan_id reused with different content}
        '429': {description: Queue full, Retry-After header set}
        '503': {description: Service draining}
  /v1/scans/{scan_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: scan_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: State and decision of a scan}
        '404': {description: Scan not found}
  /v1/sector/{sector_id}:
    get:
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: sector_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Sector capacity and inside count}
        '404': {description: Sector not found}
