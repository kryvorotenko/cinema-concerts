  stream:
    build:
      context: ./dpc
      dockerfile: spark/Dockerfile
    image: project-dpc-spark:${DPC_APP_TAG:-dev}
    environment:
      SPARK_CONF_DIR: /opt/spark-conf
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      KAFKA_BOOTSTRAP: broker:9092
      SPARK_AQE: ${SPARK_AQE:-on}
      BROADCAST_THRESHOLD: ${BROADCAST_THRESHOLD:-10m}
      WATERMARK_MINUTES: ${WATERMARK_MINUTES:-10}
    volumes:
    - data:/data
    - ./dpc/spark/jobs:/jobs:ro
    - ./dpc/configs/spark/spark-defaults.conf:/opt/spark-conf/spark-defaults.conf:ro
    restart: unless-stopped
    command:
    - sh
    - -c
    - mkdir -p /data/spark-events && exec spark-submit --master spark://spark-master:7077 --conf spark.ui.port=4041
      --conf spark.cores.max=2 --conf spark.executor.memory=1g /jobs/stream.py
    ports:
    - ${SPARK_STREAM_UI_PORT:-4041}:4041
    depends_on:
      broker-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    env_file:
