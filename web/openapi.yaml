# Контракт Web (OpenAPI 3.1), C01 «Кінотеатри й концерти». Стан: ЛР6.
# Маршрути, яких ще немає, сюди не додаються: кожна ЛР доповнює цей файл своїми.
# x-course позначає роль операції для перевірки: main, list, object.
openapi: 3.1.0
info:
  title: C01. Кінотеатри й концерти — Web
  version: 1.0.0-lr6
  description: |
    Глядач вибирає виконання (концерт або сеанс) і категорію місць, утримує K місць на 10 хвилин.
    Оплата й випуск квитка — ЛР4. Помилки — Problem Details (RFC 9457, `application/problem+json`).
    Ідентифікатори — рядки. Гроші — ціле число мінімальних одиниць (копійки) і код валюти ISO 4217.
    Моменти — RFC 3339 у UTC. `performance_id` — це `screenings.id`; у цьому API
    «подія» з маршруту `/v1/events` є виконанням (performance).

    Користувач визначається cookie сесії `session` (HttpOnly, SameSite=Lax), яку видає `POST /v1/auth/login`.
    Власник об'єкта береться лише з сесії. Зміни приймаються лише з дозволеного origin клієнта (`CLIENT_ORIGIN`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: nginx (app-a, app-b)
security:
  - sessionCookie: []

tags:
  - name: service
    description: Службові маршрути, однакові для всіх тем
  - name: auth
    description: Вхід, вихід і поточна особа
  - name: seats
    description: Конкретні місця (за прапорцем explicit-seats)
  - name: catalog
    description: Виконання та категорії місць
  - name: holds
    description: Утримання місць (у БД — таблиця bookings)
  - name: tickets
    description: Перевірка квитка сервісом DPC

paths:
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вхід
      description: |
        `login` — e-mail користувача (регістр не важливий). Сесія видається cookie `session`
        (HttpOnly, SameSite=Lax, Path=/, Max-Age 3600 с); токена в тілі немає. Невідомий логін і хибний пароль
        дають однакову відповідь 401. Зміни приймаються лише з дозволеного origin клієнта, інакше 403.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            examples:
              user:
                value: {login: alice@example.invalid, password: alice-pass}
              staff:
                value: {login: staff@example.invalid, password: staff-pass}
      responses:
        "200":
          description: Вхід виконано, cookie `session` встановлено
          headers:
            Set-Cookie:
              description: "`session=<непрозорий токен>; HttpOnly; SameSite=Lax; Path=/; Max-Age=3600`"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Хибний логін або пароль
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://example.edu/problems/invalid-credentials
                title: Invalid login or password
                status: 401
                instance: /v1/auth/login
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Вихід
      description: Сесію видалено на сервері, тому старий cookie більше не діє на жодному екземплярі.
      responses:
        "204":
          description: Вихід виконано, cookie очищено
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Поточна особа й роль
      responses:
        "200":
          description: Поточний користувач
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Живучість процесу, без звернення до бази
      security: []
      responses:
        "200":
          description: Процес відповідає
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [status, instance]
                properties:
                  status:
                    type: string
                  instance:
                    type: string
              example: {status: ok, instance: app-a}
        "4XX":
          $ref: "#/components/responses/Problem"
  /ready:
    get:
      tags: [service]
      operationId: getReady
      summary: Готовність приймати запити (база доступна, процес не завершується)
      description: Після SIGTERM відповідає 503 `draining`, а нові запити предметних маршрутів отримують 503 `shutting-down`; розпочаті запити завершуються.
      security: []
      responses:
        "200":
          description: Готовий
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  instance:
                    type: string
        "503":
          description: База недоступна або процес завершується
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "4XX":
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      tags: [service]
      operationId: getMetrics
      summary: Метрики Prometheus
      security: []
      responses:
        "200":
          description: Текстовий формат Prometheus
          content:
            text/plain:
              schema:
                type: string
        "4XX":
          $ref: "#/components/responses/Problem"

  /v1/events:
    get:
      tags: [catalog]
      operationId: listEvents
      summary: Виконання (концерти й сеанси) за часом початку
      responses:
        "200":
          description: До 100 виконань
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Performance"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/events/{id}/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Категорії місць виконання із залишком
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Категорії від дорожчої до дешевшої
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/holds:
    post:
      tags: [holds]
      operationId: createHold
      summary: Утримати місця категорії на 10 хвилин
      description: |
        Перевірка залишку, зменшення `available` і створення утримання виконуються в одній транзакції;
        відповідь надсилається після commit. Власник — користувач сесії.

        Заголовок `Idempotency-Key` обов'язковий. Той самий ключ і те саме тіло (порядок полів JSON
        не має значення) повертають збережену відповідь (201 з тим самим `id`, `Location`, `ETag`
        і заголовком `Idempotent-Replayed: true`); ефект один. Той самий ключ з іншим тілом дає 422.
        Поки перший запит з цим ключем виконується, повтор отримує 409 `request-in-progress`
        з `Retry-After`. Ключ належить користувачу й діє 24 години. Невдалі відповіді (409, 422)
        не зберігаються: повтор обчислюється заново.

        Тіло містить або `seats` (кількість; так працює клієнт попередньої версії, сервер сам призначає
        сусідні вільні місця одного ряду), або `seat_ids` (конкретні місця; лише коли прапорець
        `explicit-seats` увімкнено, інакше 422 `seat-selection-disabled`). Обидва поля разом або жодне — 422.
        Зайняте місце дає 409 `seat-taken`, місце іншої категорії чи невідоме — 422 `invalid-seat`; у цих
        випадках нічого не змінюється. Коли прапорець увімкнено, відповідь має поле `places`.
        Екземпляр, що завершує роботу, відповідає 503 `shutting-down` з `Retry-After: 1`.
      x-course: main
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldCreate"
            examples:
              normal:
                summary: Звичайний запит
                value: {category_id: cat-jazz-std, seats: 2}
              scarce:
                summary: Категорія з обмеженою кількістю місць (гонка й 409)
                value: {category_id: cat-scarce, seats: 1}
                x-capacity: 5
              missing:
                summary: Категорії немає
                value: {category_id: no-such-category, seats: 1}
              chosenSeats:
                summary: Конкретні місця (прапорець explicit-seats увімкнено)
                value: {category_id: cat-race-50, seat_ids: ["cat-race-50:A1", "cat-race-50:A2"]}
      responses:
        "201":
          description: Утримання створено
          headers:
            Location:
              description: Адреса утримання, `/v1/holds/{id}`
              schema:
                type: string
            ETag:
              description: Версія утримання
              schema:
                type: string
            Idempotent-Replayed:
              description: "`true`, якщо це збережена відповідь на повторний запит із тим самим ключем"
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
              example:
                id: 7c26c4e0-090c-4561-9f06-ec37418cad57
                performance_id: scr-jazz-1
                category_id: cat-jazz-std
                seats: 2
                holder_name: Аліса Коваль
                status: held
                version: 1
                created_at: "2035-05-01T10:00:00.000Z"
                expires_at: "2035-05-01T10:10:00.000Z"
                total: {amount_minor: 120000, currency: UAH}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConflictOrInProgress"
        "422":
          $ref: "#/components/responses/UnprocessableOrKeyReused"
        "503":
          $ref: "#/components/responses/Overloaded"
    get:
      tags: [holds]
      operationId: listHolds
      summary: Мої утримання від нових до старих
      description: Порядок `(created_at, id)` за спаданням. `next_cursor` непрозорий; зіпсований курсор дає 400.
      x-course: list
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Сторінка утримань
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Hold"
                  next_cursor:
                    type: [string, "null"]
                    description: "null — остання сторінка"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/holds/{id}:
    patch:
      tags: [holds]
      operationId: updateHold
      summary: Змінити ім'я власника утримання
      description: |
        Лише власник і лише для `held` та `confirmed`. Інші поля (`user_id`, `status`, `version`, `seats`,
        `category_id`) не змінюються: їхня поява в тілі дає 422. Чуже й неіснуюче утримання — однаковий 404.
      x-course: update
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldPatch"
            examples:
              normal:
                value: {holder_name: Олена Мельник}
              forbidden:
                value: {holder_name: Олена Мельник, user_id: usr-bob, status: confirmed, version: 99}
      responses:
        "200":
          description: Ім'я змінено, `version` збільшено
          headers:
            ETag:
              description: Нова версія утримання
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Утримання вже не можна змінити (`hold-not-editable`, статуси expired, cancelled, refunded)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      tags: [holds]
      operationId: getHold
      summary: Одне моє утримання
      description: Чуже й неіснуюче утримання дають однаковий 404.
      x-course: object
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Утримання
          headers:
            ETag:
              description: Версія утримання
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/features:
    get:
      tags: [seats]
      operationId: getFeatures
      summary: Увімкнені можливості
      responses:
        "200":
          description: Стан прапорців, потрібних клієнту
          content:
            application/json:
              schema:
                type: object
                required: [explicit_seats]
                properties:
                  explicit_seats:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/categories/{id}/seats:
    get:
      tags: [seats]
      operationId: listSeats
      summary: Схема місць категорії
      description: Доступна лише коли прапорець `explicit-seats` увімкнено, інакше 404 `feature-disabled`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Усі місця категорії та ознака вільного місця
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeatState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/categories/{id}/close-sales:
    post:
      tags: [catalog]
      operationId: closeSales
      summary: Закрити продаж категорії (персонал)
      description: Лише роль `staff`. Користувач отримує 403, навіть якщо категорії немає. Наявні утримання лишаються.
      x-course: staff-action
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "Продаж закрито (`sales_open: false`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/categories/{id}/open-sales:
    post:
      tags: [catalog]
      operationId: openSales
      summary: Відкрити продаж категорії (персонал)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: "Продаж відкрито (`sales_open: true`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenOrForeignOrigin"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tickets/{code}:
    get:
      tags: [tickets]
      operationId: getTicket
      summary: Перевірка квитка за кодом або за ідентифікатором квитка (для сервісу DPC)
      description: |
        Викликається DPC із сервісним токеном `WEB_API_TOKEN`. Контракт — docs/contracts/DPC-LR1.md.
        У шляху може бути код квитка (`TKT-DEMO-0001`) або `ticket_id` (`tkt-demo-1`): скан із картки C01
        містить лише `ticket_id`. Якщо значення є кодом одного квитка й id іншого, перемагає код.
      security:
        - serviceToken: []
      parameters:
        - name: code
          in: path
          required: true
          description: Код квитка або його ідентифікатор
          schema:
            type: string
          examples:
            byCode:
              value: TKT-DEMO-0001
            byId:
              value: tkt-demo-1
      responses:
        "200":
          description: Квиток відомий; `valid` враховує стан квитка й утримання
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCheck"
              example: {ticket_id: tkt-demo-1, performance_id: scr-jazz-1, valid: true}
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Сесія з `POST /v1/auth/login`
    serviceToken:
      type: http
      scheme: bearer
      description: Сервісний токен DPC (WEB_API_TOKEN)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Ключ операції, 1..255 видимих символів ASCII без пропусків (наприклад, UUID). Один ключ на одну
        дію користувача; усі повтори цієї дії надсилають той самий ключ. Без ключа — 400.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[\\x21-\\x7e]+$"
      example: 4b0f6c3a-6a0e-4b0d-9a4b-6f1c2c9a1e11
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозорий курсор з `next_cursor` попередньої сторінки
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  headers:
    RetryAfter:
      description: Через скільки секунд повторити
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: Ідентифікатор запиту для журналу; коректний вхідний X-Request-ID повертається без змін
      schema:
        type: string

  responses:
    Problem:
      description: Помилка (Problem Details)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: |
        Тіло не є коректним JSON, зіпсований курсор, немає або хибний `Idempotency-Key`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            malformed:
              value:
                type: https://example.edu/problems/malformed-json
                title: Request body is not valid JSON
                status: 400
                instance: /v1/holds
            keyRequired:
              value:
                type: https://example.edu/problems/idempotency-key-required
                title: Idempotency-Key header is required
                status: 400
                instance: /v1/holds
    ForeignOrigin:
      description: |
        Змінюючий запит із чужого origin (`csrf-rejected`): відхилено до будь-якої дії.
        Дозволено лише `CLIENT_ORIGIN` або запит без `Origin` і без `Sec-Fetch-Site` (не браузер)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/csrf-rejected
            title: Request from a foreign origin
            status: 403
            instance: /v1/holds
    ForbiddenOrForeignOrigin:
      description: Потрібна роль `staff` (`forbidden`) або запит із чужого origin (`csrf-rejected`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              value:
                type: https://example.edu/problems/forbidden
                title: Staff role required
                status: 403
                instance: /v1/categories/cat-jazz-std/close-sales
            foreignOrigin:
              value:
                type: https://example.edu/problems/csrf-rejected
                title: Request from a foreign origin
                status: 403
                instance: /v1/categories/cat-jazz-std/close-sales
    Unauthenticated:
      description: Немає сесії, вона невідома чи прострочена (для сервісного маршруту — токен)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Ресурсу немає (для чужого утримання — те саме)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictOrInProgress:
      description: |
        Місць недостатньо (`not-enough-seats`), продаж категорії закрито (`sales-closed`),
        виконання не продається (`performance-unavailable`) або запит з цим ключем ще виконується
        (`request-in-progress`, є `Retry-After`: повторіть той самий запит)
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notEnoughSeats:
              value:
                type: https://example.edu/problems/not-enough-seats
                title: Not enough free seats
                status: 409
                detail: Requested 6, available 5
                instance: /v1/holds
            inProgress:
              value:
                type: https://example.edu/problems/request-in-progress
                title: A request with this Idempotency-Key is still being processed
                status: 409
                detail: Repeat the same request after the time in Retry-After
                instance: /v1/holds
    UnprocessableOrKeyReused:
      description: |
        Коректний JSON із хибними даними (`invalid-request`) або той самий `Idempotency-Key`,
        уже використаний з іншим тілом (`idempotency-key-reused`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid:
              value:
                type: https://example.edu/problems/invalid-request
                title: Invalid request data
                status: 422
                errors: [{field: body.seats, message: Input should be greater than or equal to 1}]
                instance: /v1/holds
            keyReused:
              value:
                type: https://example.edu/problems/idempotency-key-reused
                title: Idempotency-Key was already used with a different request
                status: 422
                detail: Use a new key for a different request body
                instance: /v1/holds
    Overloaded:
      description: Усі з'єднання з базою зайняті; робота не починалась, повторіть після `Retry-After`
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: |
        Коректний JSON із хибними даними: відсутнє або чуже поле, неціле `seats`, `seats` поза 1..10,
        `limit` поза 1..50
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://example.edu/problems/invalid-request
            title: Invalid request data
            status: 422
            errors: [{field: body.seats, message: Input should be greater than or equal to 1}]
            instance: /v1/holds

  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    Person:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, staff]
    HoldPatch:
      type: object
      additionalProperties: false
      required: [holder_name]
      properties:
        holder_name:
          type: string
          minLength: 1
          maxLength: 100
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Поля, що не пройшли перевірку (400/422)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          description: Копійки
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    Venue:
      type: object
      required: [id, name, city, time_zone]
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        time_zone:
          type: string
          description: Назва зони IANA; час початку подається в UTC
    Performance:
      type: object
      required: [id, event_id, title, kind, starts_at, duration_min, status, venue]
      properties:
        id:
          type: string
          description: "`screenings.id` = `performance_id`"
        event_id:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [cinema, concert]
        starts_at:
          type: string
          format: date-time
        duration_min:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [scheduled, cancelled, finished]
        venue:
          $ref: "#/components/schemas/Venue"
    Category:
      type: object
      required: [id, performance_id, name, capacity, available, price, sales_open]
      properties:
        id:
          type: string
        performance_id:
          type: string
        name:
          type: string
        capacity:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0
        price:
          $ref: "#/components/schemas/Money"
        sales_open:
          type: boolean
    HoldCreate:
      type: object
      additionalProperties: false
      required: [category_id]
      oneOf:
        - required: [seats]
        - required: [seat_ids]
      properties:
        category_id:
          type: string
          minLength: 1
          maxLength: 64
        seats:
          type: integer
          minimum: 1
          maximum: 10
        seat_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
    Place:
      type: object
      required: [id, row, number]
      properties:
        id:
          type: string
        row:
          type: string
        number:
          type: integer
          minimum: 1
    SeatState:
      type: object
      required: [id, row, number, free]
      properties:
        id:
          type: string
        row:
          type: string
        number:
          type: integer
          minimum: 1
        free:
          type: boolean
    Hold:
      type: object
      required: [id, performance_id, category_id, seats, holder_name, status, version, created_at, expires_at, total]
      properties:
        id:
          type: string
        performance_id:
          type: string
        category_id:
          type: string
        seats:
          type: integer
          minimum: 1
        holder_name:
          type: string
        status:
          type: string
          enum: [held, confirmed, expired, cancelled, refunded]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        total:
          $ref: "#/components/schemas/Money"
        places:
          type: array
          description: Місця утримання; є лише коли прапорець `explicit-seats` увімкнено
          items:
            $ref: "#/components/schemas/Place"
    TicketCheck:
      type: object
      required: [ticket_id, performance_id, valid]
      properties:
        ticket_id:
          type: string
        performance_id:
          type: string
        valid:
          type: boolean
