<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кінотеатри й концерти</title>
    <style>
        body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
        fieldset { margin-bottom: 1.5rem; border: 1px solid #ccc; }
        label { display: block; margin: .4rem 0; }
        input, select { font: inherit; box-sizing: border-box; }
        button { font: inherit; margin: .25rem .25rem 0 0; }
        table { border-collapse: collapse; width: 100%; }
        td, th { border-bottom: 1px solid #ddd; padding: .25rem .5rem; text-align: left; }
        pre { background: #f3f3f3; padding: .75rem; white-space: pre-wrap; }
        .problem { color: #a00; }
        .muted { color: #666; }
    </style>
</head>
<body>
    <h1>Кінотеатри й концерти</h1>

    <fieldset>
        <legend>Вхід</legend>
        <label>Логін (e-mail)
            <input id="login" list="logins" value="alice@example.invalid" autocomplete="username">
            <datalist id="logins">
                <option value="alice@example.invalid">
                <option value="bob@example.invalid">
                <option value="staff@example.invalid">
            </datalist>
        </label>
        <label>Пароль <input id="password" type="password" autocomplete="current-password"></label>
        <button id="enter">Увійти</button>
        <button id="leave">Вийти</button>
        <span id="who" class="muted">Ви не ввійшли</span>
    </fieldset>

    <fieldset>
        <legend>Виконання й категорії</legend>
        <label>Виконання <select id="performance"></select></label>
        <table>
            <thead><tr><th>Категорія</th><th>Ціна</th><th>Вільно</th><th>Місць</th><th></th></tr></thead>
            <tbody id="categories"></tbody>
        </table>
    </fieldset>

    <fieldset>
        <legend>Мої утримання</legend>
        <button id="reload">Оновити</button>
        <table>
            <thead><tr><th>Id</th><th>Категорія</th><th>Місць</th><th>Статус</th><th>До</th><th>Сума</th></tr></thead>
            <tbody id="holds"></tbody>
        </table>
        <p id="count" class="muted"></p>
    </fieldset>

    <fieldset>
        <legend>Перевірка доступу</legend>
        <label>Id утримання (можна чужого) <input id="holdId" size="40"></label>
        <label>Нове ім'я власника <input id="holderName" value="Нове Ім'я"></label>
        <button id="readHold">Прочитати утримання</button>
        <button id="renameHold">Змінити ім'я</button>
        <label>Категорія <input id="categoryId" value="cat-jazz-std"></label>
        <button id="closeSales">Закрити продаж (персонал)</button>
        <button id="openSales">Відкрити продаж (персонал)</button>
    </fieldset>

    <h2>Результат останньої дії</h2>
    <button id="retry" hidden>Повторити з тим самим ключем</button>
    <pre id="out">—</pre>

    <script type="module">
        import {call, callIdempotent, login, logout, me, money, OutcomeUnknown, Problem, readAllPages} from "./api.js";

        const $ = (id) => document.getElementById(id);
        const show = (value, isProblem = false) => {
            $("out").className = isProblem ? "problem" : "";
            $("out").textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
        };
        const report = (error) =>
            show(error instanceof Problem ? {status: error.status, ...error.body} : String(error), true);
        const text = (value) => document.createTextNode(String(value ?? ""));
        const cell = (row, value) => row.insertCell().appendChild(text(value));
        const when = (iso) => new Date(iso).toLocaleString("uk-UA");

        async function loadPerformances() {
            const {data} = await call("GET", "/v1/events");
            const select = $("performance");
            select.replaceChildren(...data.items.map((p) => {
                const option = document.createElement("option");
                option.value = p.id;
                option.textContent = `${p.title} — ${when(p.starts_at)}, ${p.venue.name}`;
                return option;
            }));
            await loadCategories();
        }

        async function loadCategories() {
            const body = $("categories");
            body.replaceChildren();
            if (!$("performance").value) return;
            const {data} = await call("GET", `/v1/events/${encodeURIComponent($("performance").value)}/categories`);
            for (const c of data.items) {
                const row = body.insertRow();
                cell(row, c.name + (c.sales_open ? "" : " (продаж закрито)"));
                cell(row, money(c.price));
                cell(row, `${c.available} / ${c.capacity}`);
                const seats = document.createElement("input");
                seats.type = "number"; seats.min = 1; seats.value = 1; seats.style.width = "4rem";
                row.insertCell().appendChild(seats);
                const button = document.createElement("button");
                button.textContent = "Утримати";
                button.onclick = () => hold(c.id, seats.value, crypto.randomUUID());
                row.insertCell().appendChild(button);
            }
        }

        let pending = null;

        async function hold(categoryId, seats, key) {
            const body = {category_id: categoryId, seats: Number(seats)};
            try {
                const reply = await callIdempotent("POST", "/v1/holds", {
                    body,
                    key,
                    onRetry: ({attempt, delay, error}) =>
                        show(`Спроба ${attempt}: ${error.message}. Повтор через ${Math.round(delay)} мс з тим самим ключем`),
                });
                pending = null;
                $("retry").hidden = true;
                show({
                    status: reply.status,
                    location: reply.headers.get("location"),
                    replayed: reply.headers.get("idempotent-replayed") === "true",
                    attempts: reply.attempts,
                    key: reply.key,
                    body: reply.data,
                });
            } catch (error) {
                if (error instanceof OutcomeUnknown) {
                    pending = {categoryId, seats, key: error.key};
                    $("retry").hidden = false;
                    show(
                        `Результат невідомий: запит міг виконатися, відповіді немає. Ключ ${error.key}. ` +
                            "Натисніть «Повторити з тим самим ключем»: утримання не задвоїться.",
                        true,
                    );
                } else {
                    report(error);
                }
            }
            await Promise.all([loadCategories(), loadHolds()]).catch(report);
        }

        async function loadHolds() {
            const holds = await readAllPages("/v1/holds");
            const body = $("holds");
            body.replaceChildren();
            for (const h of holds) {
                const row = body.insertRow();
                cell(row, h.id);
                cell(row, h.category_id);
                cell(row, h.seats);
                cell(row, h.status);
                cell(row, h.status === "held" ? when(h.expires_at) : "");
                cell(row, money(h.total));
            }
            $("count").textContent = `Усього: ${holds.length}`;
        }

        function signedOut(message) {
            $("who").textContent = message;
            $("categories").replaceChildren();
            $("holds").replaceChildren();
            $("performance").replaceChildren();
            $("count").textContent = "";
        }

        async function start(person) {
            $("who").textContent = `${person.name}, роль: ${person.role}`;
            await loadPerformances();
            await loadHolds();
        }

        async function enter() {
            try {
                const {data} = await login($("login").value.trim(), $("password").value);
                $("password").value = "";
                await start(data);
                show({status: 200, person: data});
            } catch (error) {
                signedOut("Ви не ввійшли");
                report(error);
            }
        }

        async function leave() {
            try {
                const reply = await logout();
                signedOut("Ви вийшли");
                show({status: reply.status, message: "Сесію видалено на сервері"});
            } catch (error) {
                report(error);
            }
        }

        const holdUrl = () => `/v1/holds/${encodeURIComponent($("holdId").value.trim())}`;
        const categoryUrl = (action) => `/v1/categories/${encodeURIComponent($("categoryId").value.trim())}/${action}`;
        const attempt = (run) => async () => {
            try {
                const reply = await run();
                show({status: reply.status, etag: reply.headers.get("etag"), body: reply.data});
            } catch (error) {
                report(error);
            }
            await Promise.all([loadCategories(), loadHolds()]).catch(() => {});
        };

        $("readHold").onclick = attempt(() => call("GET", holdUrl()));
        $("renameHold").onclick = attempt(() => call("PATCH", holdUrl(), {body: {holder_name: $("holderName").value}}));
        $("closeSales").onclick = attempt(() => call("POST", categoryUrl("close-sales")));
        $("openSales").onclick = attempt(() => call("POST", categoryUrl("open-sales")));
        $("retry").onclick = () => pending && hold(pending.categoryId, pending.seats, pending.key);
        $("enter").onclick = enter;
        $("leave").onclick = leave;
        $("performance").onchange = () => loadCategories().catch(report);
        $("reload").onclick = () => Promise.all([loadCategories(), loadHolds()]).catch(report);
        me().then(({data}) => start(data)).catch(() => signedOut("Ви не ввійшли"));
    </script>
</body>
</html>
